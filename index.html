<style>
:root{--bg:#fff3f7;--bg2:#ffe4ee;--ink:#2a0f2e;--mute:#6d4f70;--card:rgba(255,255,255,.7);--line:rgba(42,15,46,.12);--pink:#e0359a;--lilac:#9b7bff;--peach:#ffa77a;--free:#0f9d76;--freebg:#d6f8ec;
--holo:linear-gradient(110deg,#e0359a,#9b7bff 45%,#ff9a6b);
--d:'Bricolage Grotesque','Arial Black',system-ui,sans-serif;--b:'Figtree',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0a1f;--bg2:#2a1030;--ink:#fff0f6;--mute:#c9a8cc;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--free:#7df0c9;--freebg:rgba(125,240,201,.14)}}
:root[data-theme="dark"]{--bg:#1a0a1f;--bg2:#2a1030;--ink:#fff0f6;--mute:#c9a8cc;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--free:#7df0c9;--freebg:rgba(125,240,201,.14)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--b);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
h1,h2,h3{font-family:var(--d);line-height:1.02;letter-spacing:-.03em;font-weight:800}
h2{font-size:clamp(34px,9vw,56px);margin-bottom:12px}
h3{font-size:21px;letter-spacing:-.02em}
section{padding:72px 20px;max-width:960px;margin:auto;position:relative}
.lead{color:var(--mute);max-width:46ch;margin-bottom:28px}
.holo{background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% 100%;animation:sh 8s linear infinite alternate}
@keyframes sh{to{background-position:100% 0}}
/* nav */
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.logo{font:800 15px var(--d);letter-spacing:.02em;text-decoration:none;color:var(--ink)}
.logo i{font-style:normal;color:var(--pink)}
nav{display:none;gap:18px}nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.tools{display:flex;gap:8px;align-items:center}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 13px;font:600 13px var(--b);cursor:pointer}
.btn{border:0;border-radius:99px;padding:14px 24px;font:800 16px var(--d);color:#fff;background:var(--holo);background-size:200% 100%;cursor:pointer;box-shadow:0 8px 28px -8px var(--pink);transition:background-position .5s,transform .2s;text-decoration:none;display:inline-block}
.btn:active{transform:scale(.96)}.btn:hover{background-position:100% 0}
.btn.sm{padding:9px 15px;font-size:13px}
.burger{width:38px;height:38px;padding:0;font-size:18px}
#sheet{position:fixed;inset:0;z-index:70;background:var(--bg);display:none;flex-direction:column;justify-content:center;gap:6px;padding:30px}
#sheet.on{display:flex}#sheet a{font:800 44px/1.15 var(--d);letter-spacing:-.03em;color:var(--ink);text-decoration:none}
#sheet .x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px}
@media(min-width:760px){nav{display:flex}.burger{display:none}}
/* hero */
#home{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-top:110px;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.o1{width:300px;height:300px;background:var(--pink);right:-100px;top:60px}.o2{width:260px;height:260px;background:var(--lilac);left:-90px;bottom:80px;animation-delay:-5s}
@keyframes fl{to{transform:translate(-30px,40px) scale(1.15)}}
#home h1{font-size:clamp(46px,14.5vw,118px);text-transform:none;margin:14px 0 20px}
.tag{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600;width:max-content}
/* frases 3D */
.bubbles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:26px 0 12px;perspective:900px}
@media(min-width:640px){.bubbles{grid-template-columns:repeat(3,1fr)}}
.bub{display:block;text-decoration:none;border:0;background:none;padding:0;cursor:pointer;height:88px;perspective:700px;animation:bob 3.8s ease-in-out infinite;animation-delay:calc(var(--i)*-.6s);-webkit-tap-highlight-color:transparent}
@keyframes bob{50%{transform:translateY(-7px)}}
.tl3,.bub .in{display:block;width:100%;height:100%;transform-style:preserve-3d}
.tl3{transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s}
.bub .in{position:relative;transition:transform .75s cubic-bezier(.2,.9,.25,1.15)}
.bub.on .in{transform:rotateY(180deg)}
.bub .f,.bub .b{position:absolute;inset:0;display:grid;place-items:center;padding:8px 14px;border-radius:24px 24px 24px 6px;font:600 15px/1.25 var(--b);text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 14px 26px -14px var(--pink)}
.bub .f{background:var(--card);border:1px solid var(--line);color:var(--ink);backdrop-filter:blur(8px)}
.bub .f::before{content:"✦";position:absolute;top:6px;right:11px;font-size:11px;color:var(--pink);animation:tw 2.2s ease-in-out infinite}
.bub .f::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-130%);animation:shine 4.6s ease-in-out infinite;animation-delay:calc(var(--i)*.7s)}
@keyframes shine{40%,100%{transform:translateX(130%)}}
.bub .b{background:var(--holo);color:#fff;transform:rotateY(180deg);font-weight:800;font-size:16px}
.bub:hover .f{border-color:var(--pink)}
.bub.cue .tl3{animation:cue 1.2s ease}
.bub.cue .f{box-shadow:0 0 0 3px color-mix(in srgb,var(--pink) 45%,transparent),0 14px 28px -10px var(--pink)}
@keyframes cue{0%,100%{transform:none}20%{transform:rotate(-5deg) scale(1.09)}45%{transform:rotate(5deg) scale(1.09)}70%{transform:rotate(-3deg) scale(1.05)}}
.cnt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600;font-size:14px}
.s3d{position:absolute;font-style:normal;color:var(--pink);opacity:.8;font-size:28px;animation:spin3d 7s linear infinite;pointer-events:none;z-index:-1}
@keyframes spin3d{to{transform:rotateY(360deg)}}
.card{transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s}
.hint{font-size:13px;color:var(--mute)}
/* about */
.ed{display:grid;gap:18px;grid-template-columns:1fr 1fr}
.ph{border-radius:26px;background:linear-gradient(160deg,var(--bg2),color-mix(in srgb,var(--lilac) 35%,var(--bg2)));border:1px dashed var(--line);display:flex;align-items:flex-end;padding:12px;font-size:12px;color:var(--mute);min-height:150px}
.arch{border-radius:999px 999px 26px 26px;min-height:300px;grid-row:span 2}
.txt{grid-column:1/-1;font-size:17px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.stats b{font-weight:600;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13px;background:var(--card)}
@media(min-width:760px){.ed{grid-template-columns:1fr 1fr 1fr}.txt{grid-column:auto}}
/* cards */
.grid{display:grid;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.ic{display:grid;place-items:center;width:56px;height:56px;border-radius:20px 20px 20px 6px;margin-bottom:12px;position:relative;background:linear-gradient(145deg,color-mix(in srgb,var(--pink) 14%,transparent),color-mix(in srgb,var(--lilac) 24%,transparent));border:1px solid var(--line)}
.ic svg{width:32px;height:32px;fill:none;stroke:url(#g);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s}
.ic::after{content:"✦";position:absolute;right:-5px;top:-8px;font-size:13px;color:var(--peach);animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.4) rotate(90deg);opacity:.35}}
.card:active .ic svg,.card.on .ic svg{transform:rotate(-8deg) scale(1.12)}
.f{fill:url(#g);stroke:none}
.soc{display:flex;gap:12px;justify-content:center;margin:16px 0}.soc a{width:50px;height:50px;border-radius:18px 18px 18px 6px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card)}.soc svg{width:26px;height:26px;fill:none;stroke:url(#g);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rg{display:block}
.card p{color:var(--mute);font-size:15px;margin-top:6px}
.big{font:800 clamp(30px,8vw,52px)/1 var(--d);letter-spacing:-.04em;margin:8px 0 22px}
.aud button{all:unset;display:block;width:100%;cursor:pointer}
.aud .card{transition:transform .3s,box-shadow .3s}
.aud .card.on{box-shadow:0 0 0 2px var(--pink),0 18px 40px -18px var(--pink);transform:perspective(700px) translateY(-3px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.aud .more{max-height:0;overflow:hidden;transition:max-height .4s;font-size:14px;color:var(--ink)}
.aud .on .more{max-height:90px;margin-top:10px}
/* timeline */
.tl{list-style:none;padding:0;margin:10px 0 30px;position:relative}
.tl::before{content:"";position:absolute;left:19px;top:8px;bottom:8px;width:2px;background:var(--holo)}
.tl li{display:flex;gap:16px;padding:10px 0;position:relative}
.tl .n{flex:none;width:40px;height:40px;border-radius:50%;background:var(--holo);color:#fff;font:800 17px/40px var(--d);text-align:center}
.tl p{color:var(--mute);font-size:15px}.tl h3{margin-top:5px}
/* pricing */
.price{background:var(--ink);color:var(--bg);border-radius:34px;padding:30px 24px;position:relative;overflow:hidden;margin-bottom:14px}
.price::after{content:"✦";position:absolute;right:20px;top:10px;font-size:90px;opacity:.12}
.price .big{font-size:clamp(56px,17vw,100px);margin:6px 0}
.price p{opacity:.8}
.price s{opacity:0}
/* booking */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.day{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:10px 14px;text-align:center;font:600 13px/1.3 var(--b);cursor:pointer;min-width:66px}
.day b{display:block;font:800 22px var(--d)}
.day.on{background:var(--holo);color:#fff;border-color:transparent}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.slot{border-radius:18px;padding:14px 4px;text-align:center;font:800 18px var(--d);border:1.5px solid var(--free);color:var(--free);background:var(--freebg);cursor:pointer}
.slot small{display:block;font:600 11px var(--b);margin-top:2px}
.slot.bk{border-color:#e5484d;color:#e5484d;background:rgba(229,72,77,.13);text-decoration:line-through;cursor:not-allowed}
.slot.me{border-color:var(--pink);color:#fff;background:var(--holo)}
.slot.sel{outline:3px solid var(--pink);outline-offset:2px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap;margin-bottom:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:var(--free)}
.legend i.b{background:#e5484d}.legend i.m{background:var(--pink)}
#confirm{display:none;text-align:center}#confirm.on{display:block;animation:pop .35s}
@keyframes pop{from{transform:scale(.94);opacity:0}}
#confirm .big{margin:4px 0 4px}
#confirm p{color:var(--mute);font-size:14px;margin-bottom:14px}
.note{font-size:12px;color:var(--mute);margin-top:12px}
/* modal */
dialog{border:0;border-radius:28px;padding:26px 22px;width:min(92vw,420px);background:var(--bg);color:var(--ink);box-shadow:0 30px 80px -20px #000a}
dialog::backdrop{background:rgba(26,10,31,.6);backdrop-filter:blur(6px)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:400 16px var(--b)}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:99px;font-weight:600;z-index:100;transition:transform .4s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
footer{text-align:center;padding:40px 20px 60px;color:var(--mute);font-size:13px}
.sp{position:fixed;pointer-events:none;z-index:90;color:var(--pink);font-size:14px;animation:sp .8s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y)) scale(0) rotate(180deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
.step{display:flex;align-items:center;gap:10px;font-weight:700;margin:14px 0 10px}
.step b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--holo);color:#fff;font:800 14px var(--d);box-shadow:0 6px 14px -6px var(--pink)}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--ink);border-radius:99px;padding:11px;font:700 14px var(--b);cursor:pointer;transition:background .25s}
.seg button.on{background:var(--holo);color:#fff}
.slot.sk{pointer-events:none;color:transparent;border-color:var(--line);background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sk 1.2s linear infinite}
.slot.sk small{color:transparent}
@keyframes sk{to{background-position:-200% 0}}
.bub .f{align-content:center;gap:5px}
.bub .f svg{width:24px;height:24px;fill:none;stroke:url(#g);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bub .f b{font:700 15px var(--b)}
.price .brl{font:600 18px var(--b);opacity:.85;margin:-4px 0 14px}
.calwrap{position:relative;padding:3px;border-radius:30px;background:var(--holo);background-size:200% 100%;animation:sh 8s linear infinite alternate;box-shadow:0 30px 70px -34px var(--pink)}
.calwrap::before,.calwrap::after{content:"✦";position:absolute;z-index:3;color:var(--pink);animation:tw 3s ease-in-out infinite;pointer-events:none}
.calwrap::before{top:-13px;right:24px;font-size:24px}.calwrap::after{bottom:-12px;left:26px;font-size:18px;color:var(--lilac);animation-delay:-1.4s}
.calin{position:relative;background:#fff;border-radius:27px;overflow:hidden;min-height:320px}
#cal{display:block;width:100%;height:780px;border:0;position:relative}
.calload{position:absolute;inset:0;z-index:2;display:grid;place-content:center;gap:6px;text-align:center;color:#6d4f70;background:linear-gradient(110deg,#fff,#fdeaf3 45%,#fff);background-size:200% 100%;animation:sk 1.6s linear infinite;transition:opacity .6s}
.calload span{font-size:38px;color:var(--pink);animation:tw 1.6s ease-in-out infinite}
.calload.off{opacity:0;pointer-events:none}
dialog{margin:auto}
.rv{--tx:0px;--ty:26px;--tr:0deg;opacity:0;translate:var(--tx) var(--ty);rotate:var(--tr)}
.rv.in{--tx:0px;--ty:0px;--tr:0deg;opacity:1}
.rv,.card.rv,.zz .ph.rv{transition:opacity .9s ease,translate .9s cubic-bezier(.2,.8,.2,1),rotate .9s ease,transform .2s,box-shadow .3s;transition-delay:var(--dl,0s),var(--dl,0s),var(--dl,0s),0s,0s}
.rv.nt{transition:none!important}
#zz,#zs{position:relative;max-width:680px;margin:0 auto;padding-left:30px}
#zz::before,#zs::before{content:"";position:absolute;left:9px;top:14px;bottom:14px;width:2px;border-radius:2px;background:linear-gradient(to bottom,var(--pink),var(--lilac),var(--peach));opacity:.55}
.zz{position:relative;margin-bottom:36px}
.zz::before{content:"✦";position:absolute;left:-30px;top:18px;width:20px;height:20px;display:grid;place-items:center;font-size:10px;color:var(--pink);background:var(--bg);border:1px solid var(--line);border-radius:50%;z-index:2;animation:tw 3.4s ease-in-out infinite}
.zt{border-radius:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--pink) 11%,var(--card)),var(--card));border:1px solid var(--line);padding:20px 20px 22px;backdrop-filter:blur(8px)}
.zn{display:block;font:800 30px/1 var(--d);letter-spacing:-.04em;background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:10px}
.zn{display:none}
.zbtn{display:block;margin:6px auto 0}
.zt p{font-size:16px;line-height:1.7;color:var(--ink);white-space:pre-line}
.fig{position:relative;overflow:hidden;margin-top:14px;border-radius:26px;border:1px solid var(--line);box-shadow:0 22px 44px -26px var(--pink);background:var(--card);line-height:0}
.fig img{display:block;width:100%;height:auto;max-height:78vh;object-fit:cover}
.fig.empty{aspect-ratio:4/3;display:flex;align-items:flex-end;padding:14px;line-height:1.4;font-size:13px;color:var(--mute);background:linear-gradient(160deg,var(--bg2),color-mix(in srgb,var(--lilac) 30%,var(--bg2)));border-style:dashed}
.fig::before{content:"✦";position:absolute;top:12px;right:15px;font-size:18px;line-height:1;color:#fff;text-shadow:0 0 10px var(--pink);animation:tw 2.8s ease-in-out infinite;z-index:2}
.fig::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.3) 50%,transparent 65%);translate:-130% 0;pointer-events:none}
.fig.in::after{animation:sweep 1.5s .45s ease both}
@keyframes sweep{to{translate:130% 0}}
.zz.zl .rv:not(.in){--tx:-34px;--tr:-2deg}
.zz.zr .rv:not(.in){--tx:34px;--tr:2deg}
/* about effects */
.zt{position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s,border-color .35s}
.zt::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);translate:-130% 0;pointer-events:none}
.zt.in::before{animation:sweep 1.6s .35s ease both}
.zt::after{content:"✦";position:absolute;right:16px;bottom:10px;font-size:16px;color:var(--pink);opacity:.5;animation:tw 3s ease-in-out infinite;pointer-events:none}
.zt:hover{transform:translateY(-4px);border-color:var(--pink);box-shadow:0 22px 40px -24px var(--pink)}
.zt p::first-letter{font:800 1.9em/1 var(--d);background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:1px}
.fig{transition:transform .25s ease-out,box-shadow .35s;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.fig:hover{box-shadow:0 30px 56px -24px var(--pink)}
.fig img{transform:scale(1.12);transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}
.fig.in img{transform:scale(1)}

const DEFAULTS={price:100,pkg:4,brl:650,calUrl:'https://calendar.google.com/calendar/appointments/schedules/AcZssZ390iuq4waR1rO5Hsn7bBhao7zSAP5ZBqzWi9eZVX8FUXdDP_nlb8qUfLwHquapJYPhrDFsUvRS'};
let S={...DEFAULTS},photos={},navUsed=false,calShown='';
const BRL=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
const calSrc=u=>{const m=String(u||'').match(/schedules\/([^\/?#]+)/);return m?'https://calendar.google.com/calendar/appointments/schedules/'+m[1]+'?gv=true':''};
const NAV=[['about','heart','n_about'],['method','chat','n_method'],['classes','plane','n_classes'],['how','pin','nav_how'],['pricing','euro','p_t'],['booking','spark','n_booking']];
const seen=new Set();let io;
function reveal(){if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');seen.add(e.target.dataset.rk);io.unobserve(e.target)}}),{threshold:.12});
 const c={};$$('#mg .card,#ag .card,.price,#pricing .grid .card,.tl li,.zz .fig,.zz .zt,.calwrap,.stats b').forEach(el=>{el.classList.add('rv');const sid=(el.closest('section')||{}).id||'x';c[sid]=(c[sid]||0)+1;const k=sid+c[sid];el.dataset.rk=k;el.style.setProperty('--dl',(c[sid]%4)*.09+'s');if(el.classList.contains('in'))return;if(seen.has(k)&&!el.closest('#story'))el.classList.add('in','nt');else io.observe(el)})}
function drawNav(){const t=T[L];$('#bubbles').innerHTML=NAV.map((n,i)=>`<a class="bub" href="#${n[0]}" style="--i:${i}"><span class="tl3"><span class="in"><span class="f"><svg><use href="#i-${n[1]}"/></svg><b>${t[n[2]]}</b></span></span></span></a>`).join('')}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

function drawAbout(){const t=T[L];
 $('#zz').innerHTML=blk(1)+`<div style="text-align:center"><button type="button" class="btn zbtn" id="zbtn" aria-haspopup="dialog">${t.rmore}</button></div>`;
 $('#zbtn').onclick=openStory;
 if($('#story').classList.contains('on'))drawStory();
 applyPh();tilt()}
function drawStory(){$('#zs').innerHTML=[1,2,3,4,5,6].map(blk).join('');applyPh();tilt()}
let stBack;
function openStory(e){const st=$('#story');if(st.classList.contains('on'))return;stBack=e&&e.currentTarget;drawStory();st.classList.remove('out');st.classList.add('on');st.setAttribute('aria-hidden','false');st.scrollTop=0;document.body.classList.add('lock');
 try{history.pushState({story:1},'')}catch(_){}
 reveal();$('#stx').focus({preventScroll:true})}
function closeStory(fromPop){const st=$('#story');if(!st.classList.contains('on')||st.classList.contains('out'))return;
 if(!fromPop&&history.state&&history.state.story){history.back();return}
 st.classList.add('out');st.setAttribute('aria-hidden','true');document.body.classList.remove('lock');
 setTimeout(()=>{st.classList.remove('on','out');$('#zs').innerHTML=''},340);
 if(stBack)stBack.focus({preventScroll:true})}

$('#stx').onclick=()=>closeStory();$('#stc').onclick=()=>closeStory();

function tilt(){$$('.zz .fig').forEach(f=>{if(f._t)return;f._t=1;f.addEventListener('pointermove',e=>{if(e.pointerType==='touch')return;const r=f.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;f.style.setProperty('--ry',x*8+'deg');f.style.setProperty('--rx',-y*8+'deg')});f.addEventListener('pointerleave',()=>{f.style.setProperty('--ry','0deg');f.style.setProperty('--rx','0deg')})})}

 reveal();
}
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<10;i++)spark(r.left+r.width/2,r.top+r.height/2,40)}
function spark(x,y,spread=30){const s=document.createElement('span');s.className='sp';s.textContent=['✦','✧','✨'][Math.random()*3|0];s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',(Math.random()-.5)*spread*3+'px');s.style.setProperty('--y',(Math.random()*-1.2-.2)*spread*2+'px');s.style.color=['#e0359a','#9b7bff','#ffa77a'][Math.random()*3|0];document.body.appendChild(s);setTimeout(()=>s.remove(),850)}
let last=0;addEventListener('pointermove',e=>{const n=Date.now();if(n-last>70){last=n;spark(e.clientX,e.clientY,14)}},{passive:true});

(async()=>{try{const c=await import('./firebase-config.js'),{ref,onValue}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');
 onValue(ref(c.db,'kamila/settings/site'),s=>{if(s.exists())S={...DEFAULTS,...s.val()};render()});
